name: QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            render-worker/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: npm.cmd ci --prefix frontend

      - name: Install render worker dependencies
        shell: pwsh
        run: npm.cmd ci --prefix render-worker

      - name: Run backend tests
        shell: pwsh
        run: python -m pytest backend/tests -q

      - name: Run frontend checks
        shell: pwsh
        run: |
          npm.cmd --prefix frontend run unit
          npm.cmd --prefix frontend run lint
          npm.cmd --prefix frontend run build

      - name: Run render worker checks
        shell: pwsh
        run: |
          npm.cmd --prefix render-worker run lint
          npm.cmd --prefix render-worker run unit

      - name: Install Chromium for Playwright
        shell: pwsh
        run: npx.cmd --prefix frontend playwright install chromium

      - name: Run browser checks
        shell: pwsh
        run: |
          npm.cmd --prefix frontend run e2e
          npm.cmd --prefix frontend run integration
        env:
          YALI_PYTHON: python
